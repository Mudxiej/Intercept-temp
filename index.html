<style>
:root {
  color-scheme: dark;
  --bg-100: #000000;
  --bg-200: #0a0a0a;
  --bg-400: #1a1a1a;
  --text-100: #ededed;
  --text-200: #a1a1a1;
  --ring: rgba(255, 255, 255, 0.10);
  --ring-strong: rgba(255, 255, 255, 0.18);
  --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --page-gutter: clamp(16px, 3vw, 40px);
  --header-height: 64px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scrollbar-color: #333 transparent; scrollbar-width: thin; }
body {
  margin: 0;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg-100);
  color: var(--text-100);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::selection { background: rgba(255, 255, 255, 0.2); }
svg { display: block; max-width: 100%; }
a { color: var(--text-100); text-decoration: underline; text-decoration-color: var(--ring-strong); text-underline-offset: 3px; transition: text-decoration-color 120ms var(--ease-out); }
a:hover { text-decoration-color: currentColor; }
:focus { outline: none; }
:focus-visible { box-shadow: 0 0 0 2px var(--bg-100), 0 0 0 3px rgba(255, 255, 255, 0.7); border-radius: 6px; }
.container { width: 100%; padding-inline: var(--page-gutter); }

.header { height: var(--header-height); background: var(--bg-100); }
.header .container { height: 100%; display: flex; align-items: center; }
.logo { display: inline-flex; align-items: center; gap: 10px; color: var(--text-100); text-decoration: none; font-weight: 600; font-size: 1rem; letter-spacing: -0.02em; width: fit-content; }

main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-block: 40px; }
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; }
h1 { margin: 0; font-size: 4rem; line-height: 1.05; letter-spacing: -0.04em; font-weight: 600; text-wrap: balance; }
.sub { margin: 0; font-size: 1.125rem; line-height: 1.6; color: var(--text-200); }

.footer { background: var(--bg-200); padding-block: 20px; }
.footer-inner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; column-gap: 40px; row-gap: 8px; }
.footer-link { font-size: 0.875rem; line-height: 1.5; color: var(--text-200); text-decoration: none; transition: color 120ms var(--ease-out); }
.footer-link:hover { color: var(--text-100); }
@media (pointer: coarse) { .footer-link { display: inline-flex; align-items: center; min-height: 32px; } }

@media (max-width: 720px) {
  h1 { font-size: 2.5rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .hero > * { animation: rise 600ms var(--ease-out) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}
</style>
</head>

</header>

<main id="main">
  <section class="container hero">

    <p class="sub">Released soon</p>
  </section>

<footer class="footer">
